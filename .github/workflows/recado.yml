name: Recado
# Corre el mandadero (claude/recado.py) cuando el chat de shape101 empuja una
# rama claude/recado-*. Cuando el mandadero falla, él mismo empuja su aviso a
# `claude/recado-fallo`; esa rama NO debe volver a disparar esto, o el aviso
# del fracaso dispara otro fracaso sin fin (63 corridas en 15 minutos el
# 15-sep-2026, medido por Jr.).
on:
  push:
    branches: ['claude/recado-*', '!claude/recado-fallo']
permissions:
  contents: write
jobs:
  hacer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          TOKEN_SHAPE101: ${{ secrets.TOKEN_SHAPE101 }}
        run: python claude/recado.py
