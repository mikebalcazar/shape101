name: Recado
on:
  push:
    branches: ['claude/recado-*']
permissions:
  contents: write
jobs:
  hacer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          TOKEN_DRAW101: ${{ secrets.TOKEN_DRAW101 }}
          TOKEN_SHAPE101: ${{ secrets.TOKEN_SHAPE101 }}
        run: python claude/recado.py
