# Arma el instalador de shape101 en un Windows de GitHub, lo prueba, lo manda a
# `descargas` por la rama de carga que espera `publicar-instalador.yml`, espera
# a que esa release exista y entonces deja `shape101.json` y el README de
# `descargas` diciendo la versión nueva. Al terminar, cualquier shape101 ya
# instalada ve el letrero «Actualizar».
#
# La receta completa, con sus trampas, está en `claude/COMO-PUBLICAR.md`.
#
# POR QUÉ
#
# El chat de shape101 (claude.ai) es el responsable de publicar el producto, pero
# su conector de GitHub sólo escribe texto: no puede subir un .exe de 120 MB ni
# crear releases. Lo que sí puede es empujar este archivo y una rama. Con eso,
# aquí se arma y se publica todo; el binario nunca pasa por el chat.
#
# CÓMO SE DISPARA
#
#   · creando una rama `claude/publicar-<version>` (p. ej. `claude/publicar-0.20.3`)
#     desde la rama que tenga el código: es lo que el conector del chat sí sabe
#     hacer (create_branch dispara el evento push), o
#   · empujando un tag `v<version>`, o
#   · a mano (workflow_dispatch) eligiendo la rama.
#   El nombre debe coincidir con core/version.py o el flujo se niega.
#
# QUÉ NECESITA (una sola vez, lo pone Mike)
#
#   Secreto del repositorio `TOKEN_DESCARGAS`: token fine-grained con acceso
#   SÓLO al repositorio `descargas`, permiso Contents: Read and write. Sin él,
#   el flujo arma y prueba igual, deja el .exe como artefacto del run, y se
#   detiene antes de cargar (lo dice claro en el resumen).
#
# PARCHES PENDIENTES
#
#   Si existe `claude/APLICAR.txt`, cada renglón es un parche de `claude/` que
#   se aplica sobre el árbol antes de armar (el chat deja el cambio así cuando
#   los archivos son grandes para reescribirlos por el conector). Cuando Jr.
#   mezcla el parche en el código, borra el renglón y el flujo no aplica nada.

name: Armar y publicar

on:
  push:
    tags: ['v*']
    branches: ['claude/publicar-*']
  workflow_dispatch:
    inputs:
      saltar_pruebas:
        description: 'Saltar python verificar.py (sólo para diagnosticar el armado)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # para podar artefactos viejos del propio repo

concurrency:
  group: armar-y-publicar
  cancel-in-progress: false

env:
  # INSTALADOR_ANTERIOR es la última release de shape101: de ahí sale el Python
  # de Windows con todo dentro, kernel de sólidos incluido. shape101 se alimenta
  # de sí mismo, así que **esa release no se borra nunca**: es el cimiento del
  # siguiente armado. (Se aprendió a golpes el 19-sep, cuando desapareció el
  # archivo del que salía el Python y el armado murió a los 19 s sin decir por
  # qué. Ver claude/COMO-PUBLICAR.md.)
  # El Windows del runner escribe cp1252: sin esto, una «→» en la salida de
  # verificar.py tumba las pruebas (corrida 34794283220).
  PYTHONUTF8: '1'
  INSTALADOR_ANTERIOR: https://github.com/mikebalcazar/descargas/releases/download/shape101-0.11.0/shape101-0.11.0-setup.exe

jobs:
  armar:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar parches pendientes (claude/APLICAR.txt)
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/armado.log") 2>&1
          if [ -f claude/APLICAR.txt ]; then
            # El Git del runner de Windows saca los archivos con CRLF (autocrlf):
            # sin quitar el \r, el renglón dice «0.20.4.patch\r» y no existe.
            while read -r p; do
              p="${p%$'\r'}"
              [ -z "$p" ] && continue
              echo "aplicando claude/$p"
              sed -i 's/\r$//' "claude/$p"
              git apply --check "claude/$p"
              git apply "claude/$p"
            done < claude/APLICAR.txt
          else
            echo "sin parches pendientes"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Versión y tag deben coincidir
        id: version
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/armado.log") 2>&1
          VER=$(python -c "import core.version as v; print(v.VERSION)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "core/version.py dice $VER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            [ "$TAG" = "$VER" ] || { echo "el tag v$TAG no coincide con core/version.py ($VER)"; exit 1; }
          elif [[ "$GITHUB_REF" == refs/heads/claude/publicar-* ]]; then
            PED="${GITHUB_REF#refs/heads/claude/publicar-}"
            [ "$PED" = "$VER" ] || { echo "la rama pide $PED pero core/version.py dice $VER"; exit 1; }
          fi
          grep -q "\"version\": \"$VER\"" package.json || { echo "package.json no dice $VER"; exit 1; }
          grep -q "shape101-$VER-setup" package.json || { echo "artifactName de package.json no dice $VER"; exit 1; }
          case "$VER" in X.*) echo "la línea X no se publica"; exit 1;; esac

      - name: Python empotrado (del último instalador publicado)
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/armado.log") 2>&1
          # -f: si la release ya no existe, que falle aquí con un mensaje y no
          # tres líneas después en 7z con un «exit 2» que no explica nada.
          curl -fsSL -o anterior.exe "$INSTALADOR_ANTERIOR" || { echo "no existe $INSTALADOR_ANTERIOR: la release de la que se saca el Python empotrado fue borrada"; exit 1; }
          # El NSIS de electron-builder guarda toda la app dentro de
          # $PLUGINSDIR/app-64.7z y deja sólo el icono suelto: hay que abrir dos
          # capas. El instalador viejo de draw101 dejaba el árbol a la vista, así
          # que esto sirve con las dos formas.
          7z x -y -oanterior anterior.exe "resources/python/*" '$PLUGINSDIR/app-64.7z' > /dev/null
          if [ -d anterior/resources/python ]; then
            mkdir -p runtime && mv anterior/resources/python runtime/python
          else
            interno=$(find anterior -name 'app-64.7z' | head -1)
            if [ -z "$interno" ]; then
              echo "el instalador no trae ni resources/python ni app-64.7z; esto es lo que hay dentro:"
              7z l anterior.exe | tail -25
              exit 1
            fi
            7z x -y -oadentro "$interno" "resources/python/*" > /dev/null
            test -d adentro/resources/python || { echo "app-64.7z no trae resources/python"; exit 1; }
            mkdir -p runtime && mv adentro/resources/python runtime/python
            rm -rf adentro
          fi
          test -f runtime/python/python.exe
          ./runtime/python/python.exe -c "import ezdxf, fastapi, uvicorn, numpy, PIL, reportlab; print('python empotrado ok')"
          rm -rf anterior anterior.exe

      - name: El kernel de sólidos dentro del Python empotrado
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/armado.log") 2>&1
          # El Python empotrado no trae pip: se instala desde el Python del
          # armador hacia adentro. Las ruedas son para este mismo Windows.
          pip install --target runtime/python/Lib/site-packages --upgrade build123d
          # Los dos mundos tienen que convivir: el kernel trae su numpy y su
          # ezdxf, y la app ya usaba los suyos. Si se pelean, que truene aquí.
          ./runtime/python/python.exe -c "import ezdxf, fastapi, uvicorn, numpy, PIL, reportlab; import build123d; from build123d import Box; print('kernel y app conviven; caja de prueba con', len(Box(1,1,1).faces()), 'caras')"
          du -sh runtime/python || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependencias de Electron
        run: npm ci --no-audit --no-fund

      - name: Motores DWG presentes
        run: |
          test -f dwgjs/node_modules/@mlightcad/libredwg-web/wasm/libredwg-web.wasm
          test -d dwgjs/node_modules/@node-projects/acad-ts/dist
          echo "motores DWG ok"

      - name: Pruebas (python verificar.py)
        if: ${{ !inputs.saltar_pruebas }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/armado.log") 2>&1
          # build123d es el kernel de sólidos. Se instala también aquí porque las
          # pruebas del 3D (t020, t021, t022) corren con ESTE Python, no con el
          # empotrado que se mete al instalador. Son dos Pythons distintos, y
          # olvidarlo fue lo que tumbó el primer intento de 0.4.0.
          pip install -q ezdxf fastapi uvicorn numpy pillow reportlab pymupdf pypdfium2 playwright build123d
          python -m playwright install chromium
          python verificar.py

      - name: Armar el instalador
        run: npx electron-builder --win nsis

      - name: Preparar la carga y el manifiesto
        id: carga
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/armado.log") 2>&1
          VER=${{ steps.version.outputs.version }}
          python build/cargar.py "dist/shape101-$VER-setup.exe" salida
          SHA=$(python -c "import json;print(json.load(open('salida/carga/meta.json'))['sha256'])")
          B=$(python -c "import json;print(json.load(open('salida/carga/meta.json'))['bytes'])")
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "bytes=$B" >> "$GITHUB_OUTPUT"
          {
            echo "## shape101 $VER armada"
            echo
            echo "- \`shape101-$VER-setup.exe\` · $B bytes · sha256 \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el instalador como artefacto del run
        uses: actions/upload-artifact@v4
        with:
          name: shape101-${{ steps.version.outputs.version }}-setup
          path: dist/shape101-${{ steps.version.outputs.version }}-setup.exe
          retention-days: 14

      # Mike, 17-sep-2026: en GitHub sólo se quedan los 3 instaladores más
      # recientes; los demás se borran aquí mismo, al final de cada corrida.
      # El instalador que cuenta vive en descargas; el artefacto es sólo el
      # respaldo del run, y 6 GB de respaldos fueron parte de lo que agotó el
      # plan de Actions en septiembre. Necesita `actions: write` (arriba).
      - name: Podar artefactos viejos (quedan los 3 más recientes)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAMILIA: shape101-
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired|not) | [.created_at, .id, .name] | @tsv' \
          | awk -F'\t' -v f="$FAMILIA" 'index($3,f)==1' \
          | sort -r | tail -n +4 \
          | while IFS=$'\t' read -r fecha id nombre; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null
              echo "borrado $nombre ($fecha)"
            done
          echo "familia $FAMILIA: quedan a lo más 3 artefactos"

      - name: Cargar a descargas (rama claude/carga-…)
        id: cargar
        env:
          TOKEN: ${{ secrets.TOKEN_DESCARGAS }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/armado.log") 2>&1
          VER=${{ steps.version.outputs.version }}
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::Falta el secreto TOKEN_DESCARGAS: el instalador quedó como artefacto del run, pero no se cargó a descargas."
            echo "- **No se cargó a descargas**: falta el secreto \`TOKEN_DESCARGAS\` (Settings → Secrets and variables → Actions)." >> "$GITHUB_STEP_SUMMARY"
            echo "cargado=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/mikebalcazar/descargas" descargas
          cd descargas
          git config user.name "shape101 (Armar y publicar)"
          git config user.email "mike@forespot.com"
          RAMA="claude/carga-shape101-$VER"
          # Desde main, no huérfana: una rama huérfana NO dispara
          # publicar-instalador.yml (medido por Jr. el 13-sep con shape101).
          git checkout -q -b "$RAMA"
          rm -rf carga && cp -r ../salida/carga carga
          git add carga
          git commit -qm "carga: shape101 $VER (armada por Actions de shape101)"
          git push -q origin "$RAMA"
          echo "rama $RAMA empujada; publicar-instalador.yml arranca solo en descargas"
          echo "cargado=si" >> "$GITHUB_OUTPUT"

      - name: Esperar la release y dejar el manifiesto en main
        if: steps.cargar.outputs.cargado == 'si'
        env:
          TOKEN: ${{ secrets.TOKEN_DESCARGAS }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/armado.log") 2>&1
          VER=${{ steps.version.outputs.version }}
          SHA=${{ steps.carga.outputs.sha256 }}
          B=${{ steps.carga.outputs.bytes }}
          URL="https://github.com/mikebalcazar/descargas/releases/download/shape101-$VER/shape101-$VER-setup.exe"
          ok=0
          for i in $(seq 1 40); do          # hasta ~20 min
            code=$(curl -s -L --max-time 300 -o bajado.exe -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then
              sha=$(sha256sum bajado.exe | cut -d' ' -f1); b=$(stat -c '%s' bajado.exe)
              if [ "$sha" = "$SHA" ] && [ "$b" = "$B" ]; then ok=1; break; fi
              echo "publicado pero no cuadra todavía ($sha / $b), reintento $i"
            else
              echo "release aún no existe ($code), reintento $i"
            fi
            rm -f bajado.exe
            sleep 30
          done
          [ $ok = 1 ] || { echo "la release shape101-$VER no apareció con la huella esperada: no se toca el manifiesto"; exit 1; }
          echo "release shape101-$VER publicada y comprobada: $B bytes · sha256 cuadra ✓"

          cd descargas
          git checkout -q main && git pull -q
          cp ../salida/shape101.json shape101.json
          python - <<'EOF'
          import re, pathlib
          renglon = pathlib.Path("../salida/readme-renglon.md").read_text(encoding="utf-8").strip()
          p = pathlib.Path("README.md"); s = p.read_text(encoding="utf-8")
          nuevo, n = re.subn(r"^\| \*\*shape101\*\* \|.*$", renglon, s, count=1, flags=re.M)
          if n != 1: raise SystemExit("no encontré el renglón de shape101 en README.md")
          p.write_text(nuevo, encoding="utf-8")
          EOF
          git add shape101.json README.md
          git commit -qm "shape101 $VER: manifiesto y README (armada y publicada por Actions de shape101)"
          git push -q origin main
          echo "- Release \`shape101-$VER\` publicada · \`shape101-ultima\` movida · \`shape101.json\` y README en main." >> "$GITHUB_STEP_SUMMARY"
          echo "- Las shape101 instaladas ya ven el letrero «Actualizar»." >> "$GITHUB_STEP_SUMMARY"

      - name: El cuaderno del armado, pase lo que pase
        if: always()
        shell: bash
        env:
          TOKEN_SHAPE101: ${{ secrets.TOKEN_SHAPE101 }}
          RESULTADOS: ${{ toJSON(steps) }}
        run: |
          # El chat no alcanza el log de Actions. Esto deja en el repositorio lo
          # que imprimió cada paso y cuál se rompió, que es todo lo que hace
          # falta para arreglarlo sin adivinar.
          set +e
          cd "$RUNNER_TEMP"
          rm -rf cuaderno && mkdir cuaderno && cd cuaderno
          git init -q .
          git config user.name "shape101 (armado)"
          git config user.email "mike@forespot.com"
          mkdir -p claude
          {
            echo "# Último armado"
            echo
            echo "- corrido: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- rama: $GITHUB_REF_NAME"
            echo "- commit: $GITHUB_SHA"
            echo
            echo '## Cómo salió cada paso'
            echo
            echo '```json'
            echo "$RESULTADOS"
            echo '```'
            echo
            echo '## Lo que imprimieron (últimas 400 líneas)'
            echo
            echo '```'
            tail -n 400 "$GITHUB_WORKSPACE/armado.log" 2>/dev/null || echo "(no hubo cuaderno)"
            echo '```'
          } > claude/ultimo-armado.md
          git add claude/ultimo-armado.md
          git commit -q -m "armado $GITHUB_REF_NAME: lo que imprimió cada paso"
          git push -q -f "https://x-access-token:$TOKEN_SHAPE101@github.com/mikebalcazar/shape101" HEAD:claude/ultimo-armado
          echo "cuaderno subido a la rama claude/ultimo-armado"
